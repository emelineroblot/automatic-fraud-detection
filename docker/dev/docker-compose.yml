# Stack de dev : PostgreSQL (3 bases) + MLflow + Airflow 3 (LocalExecutor)
# Lancer depuis la racine du projet :
#   docker compose --env-file .env -f docker/dev/docker-compose.yml up -d --build
name: fraud-detection

x-airflow-common:
  &airflow-common
  build:
    context: ../..
    dockerfile: airflow/Dockerfile
    args:
      PIP_EXTRA_ARGS: ${PIP_EXTRA_ARGS:-}
  image: fraud-detection/airflow:latest
  env_file:
    - ../../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'utc'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '10'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- Pipeline (surchargent .env : adresses internes au réseau Docker) ---
    FRAUD_DB_URI: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
    AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PYTHONPATH: /opt/airflow/src
    # Bundle CA optionnel (docker/certs/ca-bundle.pem, gitignored) si un antivirus/proxy intercepte le TLS
    REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-}
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/logs:/opt/airflow/logs
    - ../../airflow/config:/opt/airflow/config
    - ../../airflow/plugins:/opt/airflow/plugins
    - ../../src:/opt/airflow/src
    - ../../reports:/opt/airflow/reports
    - ../certs:/certs:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../../sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  mlflow:
    build:
      context: ../../mlflow
      args:
        PIP_EXTRA_ARGS: ${PIP_EXTRA_ARGS:-}
    image: fraud-detection/mlflow:latest
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  dashboard:
    build:
      context: ../../dashboard
      args:
        PIP_EXTRA_ARGS: ${PIP_EXTRA_ARGS:-}
    image: fraud-detection/dashboard:latest
    environment:
      FRAUD_DB_URI: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Europe/Paris}
    ports:
      - "${DASHBOARD_HOST_PORT:-8501}:8501"
    volumes:
      - ../../dashboard/app.py:/app/app.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,reports}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,reports}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  postgres-data:
  mlflow-artifacts:
