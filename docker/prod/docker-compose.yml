# Stack de production (EC2) : MLflow + Airflow 3 (LocalExecutor) + dashboard.
# PostgreSQL est externe (RDS, variable PGHOST) ; artefacts MLflow et rapports dans S3 (rôle d'instance).
# Lancer depuis la racine du dépôt :
#   docker compose --env-file .env -f docker/prod/docker-compose.yml up -d --build
#   docker compose --env-file .env -f docker/prod/docker-compose.yml --profile train run --rm training
name: fraud-detection

x-airflow-common:
  &airflow-common
  build:
    context: ../..
    dockerfile: airflow/Dockerfile
  image: fraud-detection/airflow:prod
  env_file:
    - ../../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@${PGHOST}:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'utc'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '30'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- Pipeline ---
    FRAUD_DB_URI: postgresql://fraud:${FRAUD_DB_PASSWORD}@${PGHOST}:5432/fraud
    AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@${PGHOST}:5432/fraud
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PYTHONPATH: /opt/airflow/src
  volumes:
    # src/ est copié dans l'image (pas de bind-mount en prod) ; les DAGs viennent du clone git
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/logs:/opt/airflow/logs
    - ../../airflow/config:/opt/airflow/config
    - ../../airflow/plugins:/opt/airflow/plugins
    - ../../reports:/opt/airflow/reports
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    mlflow:
      condition: service_healthy

services:
  mlflow:
    build:
      context: ../../mlflow
    image: fraud-detection/mlflow:prod
    env_file:
      - ../../.env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@${PGHOST}:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION:-/mlflow/artifacts}
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: ../../dashboard
    image: fraud-detection/dashboard:prod
    environment:
      FRAUD_DB_URI: postgresql://fraud:${FRAUD_DB_PASSWORD}@${PGHOST}:5432/fraud
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Europe/Paris}
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Entraînement one-shot (profil "train") : lit le CSV téléchargé depuis S3, logge + enregistre dans MLflow
  training:
    profiles: ["train"]
    build:
      context: ../..
      dockerfile: training/Dockerfile
    image: fraud-detection/training:prod
    env_file:
      - ../../.env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../../data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config,reports}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,reports}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"

volumes:
  mlflow-artifacts:
